<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Blue Circle Background -->
  <circle cx="256" cy="256" r="240" fill="#4A90E2" />

  <!-- Long Shadow -->
  <path d="M 290 270 L 440 420 L 500 360 L 440 220 H 350 Z" fill="#367AC4" opacity="0.5" />
  <path d="M 160 388 L 280 508 L 440 508 L 370 388 Z" fill="#367AC4" opacity="0.5" />

  <!-- Delivery Truck Chassis / Base -->
  <rect x="90" y="270" width="350" height="30" fill="#B0B7C0" />

  <!-- Cargo Box (White/Cream) -->
  <rect x="90" y="110" width="200" height="160" fill="#FFFFFF" />
  <!-- Tape/Stripe on Box -->
  <rect x="170" y="110" width="40" height="80" fill="#FBBF24" />

  <!-- Front Cabin (Yellow) -->
  <path d="M 290 145 H 350 L 440 220 V 300 H 290 V 145 Z" fill="#FBBF24" />

  <!-- Lower Cabin Trim (Darker Yellow) -->
  <path d="M 290 270 H 440 V 300 H 290 V 270 Z" fill="#F59E0B" />

  <!-- Left Wheel -->
  <circle cx="160" cy="340" r="48" fill="#374151" />
  <path d="M 160 292 A 48 48 0 0 1 160 388 Z" fill="#1F2937" />
  <circle cx="160" cy="340" r="22" fill="#FFFFFF" />
  <path d="M 160 318 A 22 22 0 0 1 160 362 Z" fill="#E5E7EB" />

  <!-- Right Wheel -->
  <circle cx="370" cy="340" r="48" fill="#374151" />
  <path d="M 370 292 A 48 48 0 0 1 370 388 Z" fill="#1F2937" />
  <circle cx="370" cy="340" r="22" fill="#FFFFFF" />
  <path d="M 370 318 A 22 22 0 0 1 370 362 Z" fill="#E5E7EB" />
</svg>
